name: Build and Release LiveLog-Explorer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Calculate Dynamic Semantic Version
        id: versioning
        shell: bash
        run: |
          # Use 1.0.X where X is the GitHub run_number
          VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Calculated Version: ${VERSION}"

      - name: Publish Single-File Executable
        run: |
          dotnet publish CustomExplorerApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.APP_VERSION }} -p:AssemblyVersion=${{ env.APP_VERSION }} -p:FileVersion=${{ env.APP_VERSION }} -o ./publish-out

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "LiveLog Explorer v${{ env.APP_VERSION }}"
          body: |
            version: ${{ env.APP_VERSION }}
            commit: ${{ github.sha }}
            run_number: ${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./publish-out/LiveLog-Explorer.exe
